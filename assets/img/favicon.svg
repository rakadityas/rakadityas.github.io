<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Terminal prompt R">
  <!-- terminal window -->
  <rect width="64" height="64" rx="13" fill="#1e1e1e"/>
  <rect x="1" y="1" width="62" height="62" rx="12.5" fill="none" stroke="#4ade80" stroke-opacity=".38" stroke-width="2"/>
  <!-- title bar dots -->
  <circle cx="13" cy="12" r="2.6" fill="#ff5f57"/>
  <circle cx="22" cy="12" r="2.6" fill="#febc2e"/>
  <circle cx="31" cy="12" r="2.6" fill="#28c840"/>
  <!-- prompt chevron -->
  <path d="M11 30 L20 38.5 L11 47" fill="none" stroke="#4ade80" stroke-width="5.5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- R -->
  <text x="28" y="47.5" font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace"
        font-size="27" font-weight="700" fill="#4ec9b0">R</text>
  <!-- cursor block -->
  <rect x="47" y="30" width="7" height="17.5" rx="1" fill="#4ade80"/>
</svg>
